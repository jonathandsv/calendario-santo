<main class="dia">
  @if (santo(); as s) {
    <app-ficha [santo]="s" />
  } @else {
    <app-erro-carga [carregando]="recarregando()" (tentarDeNovo)="tentarDeNovo()" />
  }

  <nav class="vizinhos" aria-label="Dias vizinhos">
    <a [routerLink]="['/dia', anterior()]">Dia anterior</a>
    <a [routerLink]="['/dia', seguinte()]">Dia seguinte</a>
  </nav>
</main>
