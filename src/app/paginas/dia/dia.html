<header class="topo">
  <div class="topo-interno">
    <div class="barra">
      <p class="mes">
        {{ mes() }}<span class="ano">{{ relogio.ano() ? ' ' + relogio.ano() : '' }}</span>
      </p>
      <a class="botao-hoje" [routerLink]="linkHoje()" (click)="irParaHoje($event)">Hoje</a>
    </div>
    <app-faixa [data]="data()" />
  </div>
</header>

<div class="conteudo">
  <main class="principal">
    @if (santo(); as s) {
      <app-ficha [santo]="s" />
    } @else {
      <app-erro-carga [carregando]="recarregando()" (tentarDeNovo)="tentarDeNovo()" />
    }
  </main>

  <aside class="lateral" aria-label="Calendário do mês">
    <app-calendario [data]="data()" />
  </aside>
</div>
