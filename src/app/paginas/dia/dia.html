<header class="topo">
  <div class="topo-interno">
    <div class="barra">
      <div class="marca">
        <span class="nome-site">Santo do Dia</span>
        <span class="mes-extenso">{{ mes() }}{{ relogio.ano() ? ' de ' + relogio.ano() : '' }}</span>
      </div>
      <button type="button" class="botao-mes" aria-haspopup="dialog" (click)="abrirCalendario($event)">
        <span>{{ mes() }}<span class="ano">{{ relogio.ano() ? ' ' + relogio.ano() : '' }}</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
      <div class="acoes">
        <a class="botao-hoje" [routerLink]="linkHoje()" (click)="irParaHoje($event)">Hoje</a>
        <button type="button" class="botao-icone" aria-label="Abrir calendário" aria-haspopup="dialog" (click)="abrirCalendario($event)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" />
          </svg>
        </button>
      </div>
    </div>
    <app-faixa [data]="data()" />
  </div>
</header>

<div class="conteudo">
  <main class="principal">
    @if (santo(); as s) {
      <app-ficha [santo]="s" />
    } @else {
      <app-erro-carga [carregando]="recarregando()" (tentarDeNovo)="tentarDeNovo()" />
    }
  </main>

  <aside class="lateral" aria-label="Calendário do mês">
    <app-calendario [data]="data()" />
  </aside>
</div>

<!-- Painel do calendário no celular (PRD 5.3). O <dialog> modal prende o foco e fecha com Esc. -->
<dialog #painel class="painel" aria-label="Escolher dia do mês" (close)="aoFecharPainel()">
  @if (calendarioAberto()) {
    <app-calendario [data]="data()" dica="Toque em um dia para ver o santo" (escolheu)="fecharCalendario()">
      <button acoes type="button" class="fechar" aria-label="Fechar calendário" (click)="fecharCalendario()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <a rodape class="hoje-painel" [routerLink]="linkHoje()" (click)="irParaHoje($event)">Hoje</a>
    </app-calendario>
  }
</dialog>
