<div class="calendario">
  <div class="topo">
    <button type="button" class="seta" aria-label="Mês anterior" (click)="mudarMes(-1)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" />
      </svg>
    </button>
    <h2 class="titulo" aria-live="polite">{{ titulo() }}@if (ano(); as a) {<span> {{ a }}</span>}</h2>
    <button type="button" class="seta" aria-label="Próximo mês" (click)="mudarMes(1)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>
    <ng-content select="[acoes]" />
  </div>

  <div class="grade">
    @if (semanas(); as linhas) {
      <table>
        <thead>
          <tr>
            @for (dia of cabecalho; track dia.curto) {
              <th scope="col"><abbr [title]="dia.longo">{{ dia.curto }}</abbr></th>
            }
          </tr>
        </thead>
        <tbody>
          @for (linha of linhas; track $index) {
            <tr>
              @for (celula of linha; track $index) {
                <td>
                  @if (celula) {
                    <a
                      class="dia"
                      [class.hoje]="celula.hoje"
                      [routerLink]="['/dia', celula.data]"
                      [attr.data-dia]="celula.data"
                      [attr.aria-label]="celula.rotulo"
                      [attr.aria-current]="celula.selecionado ? 'date' : null"
                      [attr.tabindex]="celula.data === tabulavel() ? 0 : -1"
                      (click)="escolheu.emit(celula.data)"
                      >{{ celula.numero }}</a
                    >
                  }
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    }
  </div>

  <div class="rodape">
    <p class="dica">{{ dica() }}</p>
    <ng-content select="[rodape]" />
  </div>
</div>
